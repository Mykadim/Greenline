<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1350" role="img" aria-label="Health and safety equipment, checklist, first aid and PPE arranged for workplace assurance">
  <defs>
    <linearGradient id="room" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0a1712"/>
      <stop offset="0.34" stop-color="#1d3528"/>
      <stop offset="0.68" stop-color="#c8d1c2"/>
      <stop offset="1" stop-color="#f7eedc"/>
    </linearGradient>
    <linearGradient id="surface" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#0b1712"/>
      <stop offset="0.42" stop-color="#607365"/>
      <stop offset="1" stop-color="#eee4d2"/>
    </linearGradient>
    <radialGradient id="sun" cx="78%" cy="18%" r="60%">
      <stop offset="0" stop-color="#fff7dc" stop-opacity="0.96"/>
      <stop offset="0.32" stop-color="#f4e9ce" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#f4e9ce" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fffdf5"/>
      <stop offset="1" stop-color="#e8e1d2"/>
    </linearGradient>
    <linearGradient id="hat" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fffdf5"/>
      <stop offset="0.58" stop-color="#e6dfcf"/>
      <stop offset="1" stop-color="#c9c0ad"/>
    </linearGradient>
    <linearGradient id="vest" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#eaff67"/>
      <stop offset="0.55" stop-color="#cbf24c"/>
      <stop offset="1" stop-color="#8fab31"/>
    </linearGradient>
    <linearGradient id="tablet" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#26392f"/>
      <stop offset="1" stop-color="#07120e"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="38" stdDeviation="36" flood-color="#04100b" flood-opacity="0.34"/>
    </filter>
    <filter id="softShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#04100b" flood-opacity="0.22"/>
    </filter>
    <filter id="blur">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.05"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="2400" height="1350" fill="url(#room)"/>
  <rect width="2400" height="1350" fill="url(#sun)"/>

  <!-- soft workplace background -->
  <g opacity="0.28" filter="url(#blur)">
    <rect x="1190" y="126" width="344" height="770" rx="24" fill="#f5efe2"/>
    <rect x="1570" y="80" width="540" height="700" rx="28" fill="#e4ded2"/>
    <rect x="1780" y="160" width="70" height="650" fill="#8ba88e"/>
    <rect x="1310" y="254" width="720" height="28" fill="#ffffff"/>
    <rect x="1370" y="414" width="580" height="18" fill="#ffffff"/>
  </g>

  <!-- darker brand space for homepage headline -->
  <path d="M0 0 H1045 L705 1350 H0 Z" fill="#07120e" opacity="0.55"/>
  <path d="M760 0 H1010 L620 1350 H410 Z" fill="#cbf24c" opacity="0.08"/>
  <path d="M0 835 C430 694 802 746 1168 600 C1595 430 1945 294 2400 190 L2400 1350 L0 1350 Z" fill="url(#surface)" opacity="0.7"/>

  <!-- hi-vis vest fabric -->
  <g filter="url(#shadow)" transform="rotate(-8 1690 870)">
    <path d="M1510 734 C1575 684 1682 664 1770 690 C1850 714 1908 782 1916 868 L1910 1038 C1782 1110 1608 1098 1480 1025 L1486 860 C1488 808 1502 760 1510 734 Z" fill="url(#vest)"/>
    <path d="M1604 696 L1604 1060" stroke="#f8ffe3" stroke-width="32" opacity="0.72"/>
    <path d="M1812 724 L1744 1088" stroke="#f8ffe3" stroke-width="30" opacity="0.68"/>
    <path d="M1506 874 H1904" stroke="#244130" stroke-width="16" opacity="0.38"/>
  </g>

  <!-- tablet/dashboard -->
  <g filter="url(#shadow)" transform="rotate(8 1840 810)">
    <rect x="1692" y="594" width="430" height="300" rx="34" fill="url(#tablet)"/>
    <rect x="1728" y="636" width="358" height="218" rx="18" fill="#10221a"/>
    <path d="M1760 810 C1810 744 1858 762 1902 708 C1942 660 1988 682 2050 628" fill="none" stroke="#cbf24c" stroke-width="14" stroke-linecap="round"/>
    <rect x="1764" y="678" width="96" height="18" rx="9" fill="#f3f0e7" opacity="0.5"/>
    <rect x="1764" y="728" width="210" height="14" rx="7" fill="#f3f0e7" opacity="0.28"/>
    <rect x="1764" y="760" width="150" height="14" rx="7" fill="#f3f0e7" opacity="0.22"/>
  </g>

  <!-- checklist clipboard -->
  <g filter="url(#shadow)" transform="rotate(-5 1390 710)">
    <rect x="1130" y="330" width="570" height="760" rx="34" fill="#b8ad99"/>
    <rect x="1180" y="380" width="470" height="650" rx="26" fill="url(#paper)"/>
    <rect x="1318" y="354" width="190" height="58" rx="18" fill="#26392f"/>
    <rect x="1254" y="470" width="248" height="22" rx="11" fill="#13201a" opacity="0.18"/>
    <g fill="none" stroke="#2d5a3d" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" opacity="0.86">
      <path d="M1260 580 l31 31 l62 -76"/>
      <path d="M1260 696 l31 31 l62 -76"/>
      <path d="M1260 812 l31 31 l62 -76"/>
    </g>
    <rect x="1380" y="576" width="205" height="16" rx="8" fill="#13201a" opacity="0.18"/>
    <rect x="1380" y="690" width="235" height="16" rx="8" fill="#13201a" opacity="0.15"/>
    <rect x="1380" y="806" width="180" height="16" rx="8" fill="#13201a" opacity="0.14"/>
    <rect x="1260" y="930" width="300" height="18" rx="9" fill="#cbf24c" opacity="0.62"/>
  </g>

  <!-- hard hat -->
  <g filter="url(#shadow)">
    <path d="M1670 315 C1736 190 1900 150 2036 224 C2142 282 2192 394 2182 528 L1606 528 C1614 444 1634 376 1670 315 Z" fill="url(#hat)"/>
    <path d="M1570 514 H2224 C2262 514 2292 544 2292 582 C2292 620 2262 650 2224 650 H1570 C1532 650 1502 620 1502 582 C1502 544 1532 514 1570 514 Z" fill="#e5ddcc"/>
    <path d="M1736 256 C1818 204 1930 206 2022 260" fill="none" stroke="#c7bdac" stroke-width="18" stroke-linecap="round"/>
    <path d="M1900 204 V514" stroke="#d5ccbb" stroke-width="20" opacity="0.6"/>
  </g>

  <!-- first aid kit -->
  <g filter="url(#softShadow)" transform="rotate(4 2070 990)">
    <rect x="1932" y="842" width="286" height="214" rx="28" fill="#ba3337"/>
    <rect x="2035" y="878" width="72" height="142" rx="10" fill="#fff7ea"/>
    <rect x="1998" y="913" width="146" height="72" rx="10" fill="#fff7ea"/>
    <rect x="1968" y="820" width="214" height="42" rx="20" fill="#792126"/>
  </g>

  <!-- gloves / safety glasses -->
  <g filter="url(#softShadow)">
    <path d="M1040 970 C1128 900 1284 912 1364 994 C1404 1036 1394 1094 1346 1120 C1248 1172 1088 1142 1022 1066 C996 1036 1004 1000 1040 970 Z" fill="#20382c"/>
    <path d="M1115 990 C1192 952 1284 972 1324 1018" fill="none" stroke="#cbf24c" stroke-width="14" stroke-linecap="round" opacity="0.88"/>
    <path d="M1518 1080 C1566 1036 1638 1038 1688 1082 C1628 1122 1572 1121 1518 1080 Z" fill="#14251d" opacity="0.86"/>
    <path d="M1700 1082 C1748 1038 1820 1040 1870 1084 C1812 1124 1756 1124 1700 1082 Z" fill="#14251d" opacity="0.86"/>
    <path d="M1685 1084 H1705" stroke="#cbf24c" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- premium light and texture -->
  <path d="M1300 0 H1540 L1075 1350 H835 Z" fill="#ffffff" opacity="0.08"/>
  <path d="M1860 0 H2400 V1350 H2210 Z" fill="#fff6dc" opacity="0.18"/>
  <rect width="2400" height="1350" filter="url(#grain)" opacity="0.36"/>
</svg>
